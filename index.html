<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO QUOTEX OTC AI SIGNAL SYSTEM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(circle at center, #070b19 0%, #010309 100%); color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 6px; }
        .container { width: 100%; max-width: 460px; background: linear-gradient(135deg, rgba(13, 20, 38, 0.95) 0%, rgba(4, 7, 15, 0.98) 100%); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 16px; padding: 12px; box-shadow: 0 0 40px rgba(0, 242, 254, 0.12); backdrop-filter: blur(12px); margin-top: 4px; margin-bottom: 10px; }
        h2 { text-align: center; font-size: 16px; background: linear-gradient(135deg, #00ff87 0%, #60efff 50%, #ff3366 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; font-weight: 900; text-transform: uppercase; }
        .market-notice { background: rgba(0, 242, 254, 0.08); border: 1px dashed rgba(0, 242, 254, 0.3); border-radius: 6px; padding: 6px; text-align: center; font-size: 10px; color: #60efff; font-weight: 700; margin-bottom: 8px; }
        .ai-hud-box { background: linear-gradient(180deg, rgba(6, 10, 20, 0.95) 0%, rgba(11, 17, 32, 0.95) 100%); border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 12px; padding: 12px; margin-bottom: 8px; text-align: center; }
        .signal-direction { font-size: 22px; font-weight: 900; margin: 6px 0; text-transform: uppercase; }
        .dir-buy { color: #00ff87; text-shadow: 0 0 14px rgba(0, 255, 135, 0.8); }
        .dir-sell { color: #ff3366; text-shadow: 0 0 14px rgba(255, 51, 102, 0.8); }
        .dir-none { color: #f39c12; text-shadow: 0 0 14px rgba(243, 156, 18, 0.8); }
        .signal-meta { font-size: 10px; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; text-align: left; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 6px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 8px; }
        .connected { background: rgba(0,255,135,0.2); color: #00ff87; border: 1px solid #00ff87; }
        .disconnected { background: rgba(255,51,102,0.2); color: #ff3366; border: 1px solid #ff3366; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PRO QUOTEX OTC AI SIGNAL SYSTEM</h2>
        <div class="market-notice">
            Status: <span id="wsStatus" class="status-badge disconnected">Disconnected</span>
        </div>

        <div class="ai-hud-box">
            <div style="font-size: 11px; color: #60efff; font-weight: 900; text-transform: uppercase;">Live Market Signal Feed</div>
            <div id="signalDirection" class="signal-direction dir-none">WAITING...</div>
            <div id="signalMeta" class="signal-meta">
                <div>Pair: <span id="resPair">--</span></div>
                <div>Confidence: <span id="resConf">--</span></div>
                <div>Trend: <span id="resTrend">--</span></div>
                <div>Momentum: <span id="resMom">--</span></div>
                <div>Volatility: <span id="resVol">--</span></div>
                <div>Expiry: <span id="resExp">--</span></div>
                <div>Entry Time: <span id="resTime">--</span></div>
                <div>Reason: <span id="resReason">--</span></div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        function connectWebSocket() {
            ws = new WebSocket("wss://ai-bot-sz0q.onrender.com/ws"); // Change to your deployed backend URL in production

            ws.onopen = function() {
                document.getElementById("wsStatus").innerText = "Connected (Live Data)";
                document.getElementById("wsStatus").className = "status-badge connected";
            };

            ws.onmessage = function(event) {
                let data = JSON.parse(event.data);
                
                document.getElementById("resPair").innerText = data.pair;
                document.getElementById("resConf").innerText = data.confidence + "%";
                document.getElementById("resTrend").innerText = data.trend;
                document.getElementById("resMom").innerText = data.momentum;
                document.getElementById("resVol").innerText = data.volatility;
                document.getElementById("resExp").innerText = data.expiry;
                document.getElementById("resTime").innerText = data.entryTime;
                document.getElementById("resReason").innerText = data.reason;

                let dirEl = document.getElementById("signalDirection");
                dirEl.innerText = data.decision;
                
                if (data.decision === "BUY") {
                    dirEl.className = "signal-direction dir-buy";
                } else if (data.decision === "SELL") {
                    dirEl.className = "signal-direction dir-sell";
                } else {
                    dirEl.className = "signal-direction dir-none";
                }
            };

            ws.onclose = function() {
                document.getElementById("wsStatus").innerText = "Disconnected";
                document.getElementById("wsStatus").className = "status-badge disconnected";
                setTimeout(connectWebSocket, 3000); // Reconnect attempt after 3 seconds
            };
        }

        window.onload = connectWebSocket;
    </script>
</body>
</html>
