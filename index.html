<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJA AI PREMIUM - VIP Signal Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 480px; background: #131a29; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #1f293d; margin-bottom: 20px; }
        .header { background: #1a233a; padding: 15px; text-align: center; border-bottom: 1px solid #2a3650; }
        .header h2 { color: #00ffcc; font-size: 20px; letter-spacing: 1px; }
        .content { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #2a3650; border-radius: 8px; color: #fff; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #00ffcc; color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn:hover { background: #00cca3; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>RAJA AI PREMIUM</h2>
            <div id="candleTimer" style="font-size: 13px; color: #00ffcc; margin-top: 4px;">00:15</div>
        </div>

        <div class="content" id="mainAppContent">
            <div id="defaultView" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group">
                    <label>Market Type</label>
                    <select id="marketType" onchange="updatePairs()">
                        <option value="CryptoOTC">Crypto OTC</option>
                        <option value="CryptoLive">Crypto Live</option>
                        <option value="ForexOTC">Forex OTC</option>
                        <option value="ForexLive">Forex Live</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Asset / Pair</label>
                    <select id="pairSelect"></select>
                </div>
                <button class="btn" onclick="startDeepScan()">Start Deep Quantum Scan</button>
            </div>

            <div id="scanView" style="display: none; text-align: center; padding: 10px 0;">
                <div id="scanStepText" style="font-size: 14px; margin-bottom: 10px; color: #00ffcc;">Initializing filters...</div>
                <div style="width: 100%; background: #0b0f19; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 15px;">
                    <div id="scanProgressBar" style="width: 0%; height: 100%; background: #00ffcc; transition: width 0.1s;"></div>
                </div>
                <div id="liveScanConsole" style="background: #0b0f19; padding: 10px; border-radius: 6px; font-size: 12px; text-align: left; height: 90px; overflow-y: auto; color: #94a3b8;"></div>
            </div>

            <div id="signalView" style="display: none; text-align: center; padding: 10px 0;">
                <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;" id="resModalAsset">EUR/USD (OTC)</div>
                <div id="resModalDirection" style="font-size: 22px; font-weight: bold; margin: 10px 0;"></div>
                <div id="resModalMeta" style="font-size: 12px; color: #00ffcc; margin-bottom: 15px;"></div>
                <button class="btn" onclick="showDefaultView()">Back to Scanner</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="header" style="background: #0f1624;">
            <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Admin Key Generator</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="password" id="adminPasswordInput" placeholder="Admin Pass" style="padding: 8px; background: #0b0f19; border: 1px solid #2a3650; border-radius: 6px; color: #fff; width: 50%;">
                <button class="btn" style="padding: 8px; width: 50%; font-size: 13px;" onclick="generateKey()">Generate</button>
            </div>
            <div id="generatedKeyDisplay" style="font-size: 12px; color: #00ffcc; margin-bottom: 6px;"></div>
            <button class="btn" id="copyKeyBtn" style="display: none; padding: 6px; font-size: 12px; background: #1a233a; color: #00ffcc; border: 1px solid #00ffcc;" onclick="copyGeneratedKey()">Copy Key</button>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let scanInterval = null;
        let latestGeneratedKey = "";

        function initCandleTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let now = new Date();
                let remaining = 15 - (now.getSeconds() % 15);
                if (remaining === 15) remaining = 0;
                let timerEl = document.getElementById('candleTimer');
                if (timerEl) timerEl.innerText = "00:" + (remaining < 10 ? "0" + remaining : remaining);
            }, 1000);
        }

        const brokerAssets = {
            "Quotex": {
                "CryptoLive": ["BTC/USD", "ETH/USD", "SOL/USD", "XRP/USD"],
                "CryptoOTC": ["BTC/USD (OTC)", "ETH/USD (OTC)", "SOL/USD (OTC)", "ADA/USD (OTC)"],
                "ForexLive": ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD"],
                "ForexOTC": ["EUR/USD (OTC)", "GBP/USD (OTC)", "AUD/CAD (OTC)", "EUR/GBP (OTC)", "NZD/CAD (OTC)"]
            }
        };

        function updatePairs() {
            let marketType = document.getElementById('marketType');
            let pairSelect = document.getElementById('pairSelect');
            if (!marketType || !pairSelect) return;
            
            pairSelect.innerHTML = "";
            let pairs = brokerAssets["Quotex"][marketType.value] || [];
            pairs.forEach(pair => {
                let opt = document.createElement('option');
                opt.value = pair;
                opt.innerText = pair;
                pairSelect.appendChild(opt);
            });
        }

        function showDefaultView() {
            document.getElementById('defaultView').style.display = 'flex';
            document.getElementById('scanView').style.display = 'none';
            document.getElementById('signalView').style.display = 'none';
        }

        function startDeepScan() {
            document.getElementById('defaultView').style.display = 'none';
            document.getElementById('scanView').style.display = 'block';

            let progressBar = document.getElementById('scanProgressBar');
            let consoleBox = document.getElementById('liveScanConsole');
            let stepText = document.getElementById('scanStepText');

            if (progressBar) progressBar.style.width = '0%';
            if (consoleBox) consoleBox.innerHTML = `<div style="color: #00ffcc;">Initializing quantum filters...</div>`;

            let progress = 0;
            if (scanInterval) clearInterval(scanInterval);

            scanInterval = setInterval(() => {
                progress += 20;
                if (progress <= 100 && progressBar) {
                    progressBar.style.width = progress + '%';
                }
                if (consoleBox && stepText) {
                    if (progress === 40) {
                        consoleBox.innerHTML += `<div>RSI & EMA Convergence: PASSED</div>`;
                        stepText.innerText = "Analyzing Bollinger Bands...";
                    } else if (progress >= 100) {
                        clearInterval(scanInterval);
                        finishScanResult();
                    }
                }
            }, 100);
        }

        function finishScanResult() {
            let pairSelect = document.getElementById('pairSelect');
            let selectedPair = pairSelect ? pairSelect.value : "EUR/USD (OTC)";
            document.getElementById('resModalAsset').innerText = selectedPair;

            let isBuy = Math.random() > 0.45;
            document.getElementById('scanView').style.display = 'none';
            document.getElementById('signalView').style.display = 'block';

            let dirEl = document.getElementById('resModalDirection');
            let metaEl = document.getElementById('resModalMeta');

            if (isBuy) {
                dirEl.style.color = "#00ffcc";
                dirEl.innerHTML = "⬆ UP (BUY)";
                metaEl.innerHTML = `Accuracy: 96.8%`;
            } else {
                dirEl.style.color = "#ff3366";
                dirEl.innerHTML = "⬇ DOWN (SELL)";
                metaEl.innerHTML = `Accuracy: 95.4%`;
            }
        }

        function generateKey() {
            let adminPass = document.getElementById('adminPasswordInput').value.trim();
            if (adminPass !== "raja2026") {
                alert("Incorrect Admin Password!");
                return;
            }
            latestGeneratedKey = 'RAJA-VIP-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('generatedKeyDisplay').innerText = "Generated Key: " + latestGeneratedKey;
            document.getElementById('copyKeyBtn').style.display = 'block';
        }

        function copyGeneratedKey() {
            navigator.clipboard.writeText(latestGeneratedKey);
            alert("License key copied to clipboard!");
        }

        window.onload = function() {
            initCandleTimer();
            updatePairs();
        };
    </script>
</body>
</html>
